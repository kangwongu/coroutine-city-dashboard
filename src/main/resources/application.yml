spring:
  application:
    name: coroutine-city-dashboard

server:
  tomcat:
    threads:
      # Phase 4 블로킹 클라이언트 비교 실험용으로 의도적으로 낮게 설정.
      # 적은 수의 동시 요청으로도 톰캣 스레드 풀 소진 여부 차이가 드러나게 한다.
      max: 10
    mbeanregistry:
      # 내장 톰캣은 기본적으로 스레드풀 MBean을 등록하지 않아 tomcat.threads.busy 등
      # 액추에이터 메트릭이 노출되지 않는다. 부하 테스트에서 스레드 점유량을 확인하려면 필요.
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

external-api:
  # 아래 API 키들은 의도적으로 평문 커밋한다.
  # 배포하지 않고 로컬에서만 띄우는 개인 연습용 프로젝트이고, 두 키 모두 무료 플랜이라
  # 공개 저장소에 노출돼도 감수할 수 있다고 판단해 별도 시크릿 관리 없이 코드에 둔다.
  weather:
    base-url: https://api.openweathermap.org
    api-key: b717d5f4fc73b54e9af08efdc5a76190
  country:
    base-url: https://api.restcountries.com/countries/v5
    api-key: rc_live_553a7a5fe74f4952b01059896f8a7222
  holiday:
    base-url: https://date.nager.at/api/v3
  exchange-rate:
    base-url: https://api.frankfurter.dev/v1
